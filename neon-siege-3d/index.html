  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #04030c; }
    /* The HUD overlay is appended outside the HUD root, so give it the page font and colours. */

    .hud-overlay .hud-overlay-inner h2 { color: #f5d0fe; text-shadow: 0 0 18px #ff2d95, 0 0 42px rgba(34, 211, 238, 0.55); }
    .hud-overlay .hud-button { background: linear-gradient(135deg, #ff2d95, #7c3aed); box-shadow: 0 0 22px rgba(255, 45, 149, 0.5); letter-spacing: 0.06em; text-transform: uppercase; }
